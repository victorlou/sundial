# XcodeGen spec. Sundial.xcodeproj is generated from this file and git-ignored:
# run `xcodegen generate` in ios/ after pulling or after editing this file.
# Build configurations and schemes follow docs/06-environments-and-release.md §2.
name: Sundial

options:
  deploymentTarget:
    iOS: "26.0"  # NFR-06: the current iOS major or the one before
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug-Local: debug
  Debug-Dev: debug
  Release-Dev: release
  Release-Prod: release

packages:
  Domain:
    path: Packages/Domain
  Data:
    path: Packages/Data
  Features:
    path: Packages/Features

targets:
  Sundial:
    type: application
    platform: iOS
    sources:
      - App
    configFiles:
      Debug-Local: Config/Local.xcconfig
      Debug-Dev: Config/Dev.xcconfig
      Release-Dev: Config/Dev.xcconfig
      Release-Prod: Config/Prod.xcconfig
    dependencies:
      - package: Domain
      - package: Data
      - package: Features
    settings:
      base:
        PRODUCT_NAME: Sundial
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_NAME)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Sundial.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  Sundial (Local):
    build:
      targets:
        Sundial: all
    run:
      config: Debug-Local
    test:
      config: Debug-Local
    profile:
      config: Debug-Local
    analyze:
      config: Debug-Local
    archive:
      config: Debug-Local
  Sundial (Dev):
    build:
      targets:
        Sundial: all
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Sundial (Prod):
    build:
      targets:
        Sundial: all
    run:
      config: Release-Prod
    test:
      config: Release-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Release-Prod
    archive:
      config: Release-Prod
